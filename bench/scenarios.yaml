# Benchmark tickets for the refund triage agent. Fernway, its customers and every address are FICTIONAL
# (data/billing.json). Each ticket is one email with the date it arrived and the expected outcome.
#
# expect.decision   refund_issued | sent_for_approval | declined | needs_details | escalated | not_refund_request
# expect.charge_id  the charge the ticket is about (null when there is none)
# expect.amount     the amount refunded or sent for approval (only for those two decisions)
# expect.queue      billing_lead for approvals; risk or tier2 for escalations
# expect.basis      why the expectation holds, checked by tests/test_scenarios.py against rta/policy.py:
#                     charge   - check_charge() on this charge, sender and date returns exactly this decision
#                     identity - the sender may not act on the charge's account (unknown or someone else's)
#                     request  - what the email asks for decides it (partial amount, dispute, credit, question,
#                                missing invoice); the sender is authorised and code routes the escalation
# reply_must_include  groups of alternatives: at least one per group must appear in the reply
# reply_must_not      phrases that must not appear (internal terms are always forbidden on top of these). One level
#                     of nesting is flattened, because YAML can't append to an alias: [*no_refund_claims, 're:...']
# tools_must_not      tools that must not be called at all, not even when the code would refuse them
# (in code)           bench/grade.py also checks, on every ticket, the reply's layout (line breaks, the sign-off on its
#                     own line) and, on a declined charge with a refund window, that a stated end of the window is
#                     its last day (worked out from data/billing.json)
# example_reply       a reply that passes every check (the tests grade it; it is not shown to the model)
# alt_replies         other correct wordings that must pass too (tests only: the checks must not demand one phrasing)
# wrong_replies       replies that must fail; each one has every required fact, so it fails only on what it claims
#
# Where a document was silent and a choice had to be made, the comment on the ticket says so and
# DECISIONS.md explains it. Alternatives are regular expressions when they start with "re:". Replies are matched
# after normalisation (lower case, straight quotes, "1,000" read as "1000").

x-checks:
  payout: &payout ['re:\b(5|five)\s*(to|-|and)\s*(10|ten)\s+(business|working)\s+days']
  # The customer can turn renewal off: the customer's own action, in either word order ("prevent the plan from
  # renewing", "opt out of renewal" and "choose not to renew" count too). A bare "won't renew" doesn't count, because
  # the plan renews unless the customer turns renewal off; renewal_claims below fails the false claims.
  auto_renew: &auto_renew
    - 're:auto[- ]?renew'
    - 're:automatic(ally)? renew'
    - 're:renew(s|al)? automatically|\b(switch|turn)(ing)? off (the |your )?(plan''?s )?renewal|\b(switch|turn)(ing)? (the |your )?renewal off|\bdisabl(e|ing) (the |your )?renewal|\bstop(ping)? (the |your )?(plan''?s )?renewal|\bcancel(l?ing)? (the |your )?renewal|\bstop (it|the plan|your plan) (from )?renewing|\bprevent(ing)? (it|the plan|your plan) from renewing|\bopt(ing)? out of (the |your )?(auto[- ]?)?renewal|\bchoose not to renew'
  # The plan renews unless the customer turns renewal off: the agent can't turn it off ("I'll turn off renewal for
  # you"), and the plan doesn't stop renewing by itself ("your plan won't auto-renew"). On every ticket that needs
  # the renewal fact (a04, a05, i01, f01).
  renewal_claims: &renewal_claims
    # The first pattern also stands alone (&renewal_agent_claim) for s02, where the whole list doesn't fit (second-run
    # audit): removed seats really don't renew, so s02 has its own copy of the second pattern.
    - &renewal_agent_claim 're:\b(we|i)(''ll| will|''ve| have)( now| also| just)? (turn(ed)?|switch(ed)?|stop(ped)?|cancel(l?ed)?|disabl(e|ed)|prevent(ed)?|opt(ed)? out)\b[^.;!?]{0,30}\brenew'
    - 're:(?:^|[.;!?]\s?)(?:(?!\b(?:turn|switch|disabl|stop|cancel)\w*\b|\bso\b|\bif\b|\bunless\b)[^.;!?])*?\b(won''t|will not|doesn''t|does not|isn''t going to|is not going to)\s+(auto[- ]?renew|renew automatically)\b'
  seven_days: &seven_days ['re:\b(7|seven)[- ]days?\b']
  thirty_days: &thirty_days ['re:\b(30|thirty|30th)[- ]days?\b', 're:\b30th day\b']
  approval: &approval ['re:approv']
  # A person will act, or the request has been passed on ("you'll hear back from a colleague" counts). "I reviewed
  # the charge" alone does not count, and neither does "we will not ..." or an action left to the customer ("you can
  # reply", "feel free to reply", "if you reply", "we need you to reply").
  follow_up: &follow_up
    - 're:\b(will|''ll|is going to|are going to)\b(?!\s+(?:not|never)\b)(?:(?!\byou (?:can|may|could)\b|\byou(?:''re| are) (?:welcome|free)\b|\bfeel free\b|\b(?:if|when|once) you\b|\b(?:need|want|ask) you to\b)[^.;!?]|\.\d){0,80}\b(review|look (into|at)|reply|respond|get back|follow up|be in touch|contact you|reach out|get in touch|hear (back )?from)|\b(passed|forwarded|handed|sent|referred|escalated) (it|this|that|them|your (refund )?(request|question|message|email|ticket|query))( on| over)? to\b'
  # No refund happened and none is promised (declines, escalations, needs details, questions). A negated sentence
  # ("No refund has been issued yet."), a clause about whether one will be ("a colleague will let you know whether
  # the refund will be processed") and handling the request ("I've sent your refund query to a colleague") are not
  # claims.
  no_refund_claims: &no_refund_claims
    - 're:\b(we|i)(''ve| have)( now| just| already| also)? (issued|processed|approved|sent) (a |your |the )?(full )?([$€£]\s?[\d.,]+ )?refund(?! request| question| query| enquiry| inquiry)'
    - 're:(?<!\bno )(?<!\bno full )\brefund (has been|is being|was) (issued|processed|approved)'
    - 're:\b(we|i)(''ve| have)( now| just| already| also)? refunded'
    - 're:\b(we|i)(''ll| will)( now| also| still)? (issue |process |send )?(you )?(a |your |the )?(full )?([$€£]\s?[\d.,]+ )?refund(?! request| question| query| enquiry| inquiry)'
    - 're:\byou(''ll| will) (receive|get|see) (a |your |the )?(full )?([$€£]\s?[\d.,]+ )?refund(?! request| question| query| enquiry| inquiry)'
    - 're:(?<!\bno )(?<!\bno full )\brefund (of|for) ([^.]|\.\d){0,40}(has been|was|is being) (issued|processed|approved|made)'
    - 're:\b(we|i)(''re| are| am|''m) (now )?(processing|issuing) (a |your |the |this )?(full )?([$€£]\s?[\d.,]+ )?refund(?! request| question| query| enquiry| inquiry)|\b(we|i)(''re| are| am|''m) (now )?refunding\b'
    - 're:\b(we|i)(''ve| have) (now |just |also )?(initiated|arranged|started|set up) (a |your |the |this )?(full )?([$€£]\s?[\d.,]+ )?refund(?! request| question| query| enquiry| inquiry)|\b(we|i)(''ve| have) (now |just |also )?gone ahead and refunded'
    - 're:(?<!whether )(?<!if )\b(your|the) refund will be (processed|issued)'
    - 're:(?<!whether )(?<!if )\b(we|i)(''ll| will)( now| also| still)? issue (it|one)\b'
    # Second-run audit: a refund promised by a colleague or anyone else (review of the second-run changes: not with a
    # condition after it, "if one is due"); "your refund is approved" outside an if, once, when, as soon as,
    # provided ... clause; "your refund is on its way", "you'll be refunded", "we've granted your refund", "the money
    # will be returned" (not after no, none, nothing or not). A decimal point ("$380.00") doesn't end a sentence in
    # these patterns.
    - 're:\b(?:will|''ll)\b(?!\s+(?:not|never)\b)(?: (?!(?:whether|if|when|once|can|could|may|might|be|not|never|only)\b)[a-z]+){0,3} (?:process|issue|send|complete|arrange)\b (?:you )?(?:a |your |the |this )?(?:full )?(?:[$€£]\s?[\d.,]+ )?refund(?! request| question| query| enquiry| inquiry| decision| outcome| status| update| review| claim)(?!(?:[^.;!?]|\.\d)*\b(?:if (?:it is |it''s |one is |that''s |it gets )?(?:due|approved|appropriate|allowed|eligible|possible|agreed)|where (?:appropriate|due|possible)|whether)\b)'
    - &refund_is_approved 're:(?:^|[;!?:]\s?|\.(?!\d)\s?)(?:(?!\b(?:if|once|when|whenever|whether|unless|until|after|before|provided|providing|assuming|as soon as|(?<!\bat )the moment|in case|as long as|so long as)\b)(?:[^.;!?]|\.\d))*?\b(?:your|the|this) (?:full )?(?:[$€£]\s?[\d.,]+ )?refund\b(?:(?!\b(?:if|once|when|whenever|whether|unless|until|after|before|provided|providing|assuming|as soon as|(?<!\bat )the moment|in case|as long as|so long as)\b)(?:[^.;!?]|\.\d)){0,40}? is (?:now |already )?approved\b'
    - 're:(?:^|[;!?:]\s?|\.(?!\d)\s?)(?:(?!\b(?:whether|if|promise|guarantee|sure|confirm|know|decide|check)\b)(?:[^.;!?:]|\.\d))*?(?:(?<!\bno )\brefund\b(?:[^.;!?]|\.\d){0,40}\b(?:is|''s) (?:now )?on (?:its|the) way\b|\byou(?:''ll| will) be refunded\b|\b(?:we|i)(?:''ll| will) get (?:that|it|this) refunded\b|\b(?:we|i)(?:''ve| have)(?: now| just| already| also)? granted (?:a |your |the )?(?:full )?refund\b|\b(?:the|your) (?:money|amount|payment)\b(?:(?!\b(?:no|none|nothing|not|never)\b|n''t\b)(?:[^.;!?]|\.\d)){0,30}?\s(?:will be|has been|is being) (?:returned|sent back|paid back)\b|[$€£]\s?\d[\d.,]*\s(?:will be|has been|is being) (?:returned|sent back|paid back)\b)'
  # No refund happened (a question about the policy may still say what the policy would give). These are the
  # no_refund_claims patterns without the promises (tests/test_scenarios.py keeps the two lists in step).
  past_refund_claims: &past_refund_claims
    - 're:\b(we|i)(''ve| have)( now| just| already| also)? (issued|processed|approved|sent) (a |your |the )?(full )?([$€£]\s?[\d.,]+ )?refund(?! request| question| query| enquiry| inquiry)'
    - 're:(?<!\bno )(?<!\bno full )\brefund (has been|is being|was) (issued|processed|approved)'
    - 're:\b(we|i)(''ve| have)( now| just| already| also)? refunded'
    - 're:(?<!\bno )(?<!\bno full )\brefund (of|for) ([^.]|\.\d){0,40}(has been|was|is being) (issued|processed|approved|made)'
    - 're:\b(we|i)(''re| are| am|''m) (now )?(processing|issuing) (a |your |the |this )?(full )?([$€£]\s?[\d.,]+ )?refund(?! request| question| query| enquiry| inquiry)|\b(we|i)(''re| are| am|''m) (now )?refunding\b'
    - 're:\b(we|i)(''ve| have) (now |just |also )?(initiated|arranged|started|set up) (a |your |the |this )?(full )?([$€£]\s?[\d.,]+ )?refund(?! request| question| query| enquiry| inquiry)|\b(we|i)(''ve| have) (now |just |also )?gone ahead and refunded'
    - *refund_is_approved
  # Sent for approval: nothing is refunded or approved yet. "Once it is approved" is fine; "it has been approved" is not.
  approval_no_claims: &approval_no_claims
    - 're:\b(we|i)(''ve| have)( now| just| already| also)? (issued|processed) (a |your |the )?(full )?([$€£]\s?[\d.,]+ )?refund(?! request| question| query| enquiry| inquiry)'
    - 're:(?<!\bno )(?<!\bno full )\brefund (has been|was) (issued|processed)'
    - 're:\b(we|i)(''ve| have)( now| just| already| also)? refunded'
    - 're:(?<!once )(?<!when )(?<!after )(?<!until )(?<!if )(?<!as soon as )(?<!before )\b((your|the) refund\b((?!\b(once|when|after|until|if|before|as soon as|provided|providing|assuming)\b)([^.;!?]|\.\d)){0,60}?|it) (has been|have been|was|is now) approved'
    - 're:(?<!once )(?<!when )(?<!after )(?<!until )(?<!if )(?<!as soon as )(?<!before )\b(we|i)(''ve| have)?( now| just| already| also)? approved\b'
    - 're:(?<!\bno )(?<!\bno full )\brefund (of|for) ([^.]|\.\d){0,40}(has been|was) (issued|processed|made)'
    # Second-run audit: "your refund is approved", "has been authorised", "is confirmed", and "you'll
    # receive your refund" with no condition or approval in the same clause.
    - *refund_is_approved
    - 're:(?:^|[;!?:]\s?|\.(?!\d)\s?)(?:(?!\b(?:if|once|when|whenever|whether|unless|until|after|before|provided|providing|assuming|as soon as|(?<!\bat )the moment|in case|as long as|so long as)\b)(?:[^.;!?:]|\.\d))*?(?:\b(?:your|the) (?:[$€£]\s?[\d.,]+ )?refund\b(?:(?!\b(?:if|once|when|whenever|whether|unless|until|after|before|provided|providing|assuming|as soon as|(?<!\bat )the moment|in case|as long as|so long as)\b)(?:[^.;!?:]|\.\d)){0,60}?\b(?:is|has been|was)(?: now)? (?:approved|authori[sz]ed|confirmed)\b|(?<!\bno )\bit (?:is|has been|was)(?: now)? (?:approved|authori[sz]ed|confirmed)\b|(?<!\bno )\bapproval (?:is|has been|was) (?:done|given|granted|complete)\b)(?:(?!\b(?:if|once|when|whenever|whether|unless|until|after|before|provided|providing|assuming|as soon as|(?<!\bat )the moment|in case|as long as|so long as)\b)(?:[^.;!?:]|\.\d))*(?=[.;!?:](?!\d)|$)'
    - 're:(?:^|[;!?:]\s?|\.(?!\d)\s?)(?:(?!\b(?:if|once|when|whenever|whether|unless|until|after|before|provided|providing|assuming|as soon as|(?<!\bat )the moment|in case|as long as|so long as)\b)(?:[^.;!?:]|\.\d))*?\byou(?:''ll| will) (?:receive|get|see) (?:a |your |the )?(?:full )?(?:[$€£]\s?[\d.,]+ )?(?:refund|money)\b(?:(?!\b(?:if|once|when|whenever|whether|unless|until|after|before|provided|providing|assuming|as soon as|(?<!\bat )the moment|in case|as long as|so long as)\b|\bapprov\w*)(?:[^.;!?:]|\.\d))*(?=[.;!?:](?!\d)|$)'
    # Review of the second-run changes: the refund said to be on its way, returned or granted while it waits for
    # approval.
    - 're:(?:^|[;!?:]\s?|\.(?!\d)\s?)(?:(?!\b(?:if|once|when|whenever|whether|unless|until|after|before|provided|providing|assuming|as soon as|(?<!\bat )the moment|in case|as long as|so long as)\b|\b(?:promise|guarantee|sure|confirm|know|decide|check)\b|\bapprov\w*)(?:[^.;!?:]|\.\d))*?(?:(?<!\bno )\brefund\b(?:[^.;!?]|\.\d){0,40}\b(?:is|''s) (?:now )?on (?:its|the) way\b|\byou(?:''ll| will) be refunded\b|\b(?:we|i)(?:''ll| will) get (?:that|it|this) refunded\b|\b(?:we|i)(?:''ve| have)(?: now| just| already| also)? granted (?:a |your |the )?(?:full )?refund\b|\b(?:the|your) (?:money|amount|payment)\b(?:(?!\b(?:no|none|nothing|not|never)\b|n''t\b)(?:[^.;!?]|\.\d)){0,30}?\s(?:will be|has been|is being) (?:returned|sent back|paid back)\b|[$€£]\s?\d[\d.,]*\s(?:will be|has been|is being) (?:returned|sent back|paid back)\b)(?:(?!\b(?:if|once|when|whenever|whether|unless|until|after|before|provided|providing|assuming|as soon as|(?<!\bat )the moment|in case|as long as|so long as)\b|\bapprov\w*)(?:[^.;!?:]|\.\d))*(?=[.;!?:](?!\d)|$)'
  # Refund issued: it is done, not waiting for anyone. Second-run audit: also awaiting, subject to,
  # requires, "sent for approval", "once approval is given"; a negated wording passes ("it doesn't even need approval",
  # "it isn't awaiting approval", "nothing has to be approved", "it wasn't sent for approval"). Review of the
  # second-run changes: sign-off and "will be approved" fail too; "without waiting for approval" and "nothing is
  # pending approval" pass.
  issued_no_pending: &issued_no_pending
    - 're:(?<!not )(?<!n''t )(?<!nothing )(?<!nothing is )(?<!nothing''s )(?<!without )(?<!no )\b(waiting for|awaiting) (a |the |any )?(final |further )?approval|(?<!not )(?<!n''t )(?<!nothing )(?<!nothing is )(?<!nothing''s )(?<!never )\bpending (a |the |any )?(final |further )?approval|(?<!not )(?<!n''t )(?<!never )\bsubject to (a |the |any |final |further )*approval|(?<!n''t need to wait )(?<!n''t have to wait )(?<!no need to wait )(?<!not need to wait )\b(once|until|after) (it''?s |it is |it has been |it''?s been |it gets |the refund is |the refund has been )?approved|\bafter (a |the |final )?approval\b|(?<!not )(?<!n''t )(?<!not even )(?<!n''t even )(?<!nothing )(?<!nothing else )(?<!never )\b(needs?|requires?) (a |an |the |final |further )*approval|(?<!not )(?<!n''t )(?<!nothing )(?<!nothing else )(?<!never )\b(needs?|requires?|has|have) to be approved|(?<!not )(?<!n''t )(?<!never )(?<!n''t been )(?<!not been )(?<!never been )(?<!n''t have to be )(?<!n''t need to be )(?<!not need to be )(?<!not have to be )\b(sent|submitted|forwarded|passed|referred)\b([^.;!?]|\.\d){0,40}\bfor (a |the |final |further )*approval|(?<!no )\bonce approval\b'
    - 're:(?<!not )(?<!n''t )(?<!nothing )(?<!nothing is )(?<!nothing''s )(?<!never )(?<!without )\b(?:waiting for|awaiting|pending|subject to|needs?|requires?|will need) (?:a |an |the |any |final |further )*sign[- ]?off\b|(?<!not )(?<!n''t )(?<!nothing )(?<!never )\b(?:needs?|has|have|will need) to be signed off\b|(?<!n''t )(?<!not )(?<!never )\bwill be approved\b'
  # A declined annual or seat ticket must not give a wrong closing point for the 30-day window, such as "the window
  # closed 45 days in" or "closed on day 45" (the ticket date). Day 30 is the last day inside and day 31 the first
  # outside (DECISIONS gap 1), so "closed after 30 days" and "closed 31 days later" both pass, and so does a trial
  # period. Only on tickets whose replies have no other window to describe (a04, a05, s02, i01): not f01, o01 or q01.
  # No tool cancels a plan, closes a workspace or processes a cancellation, so no reply may claim or promise one, on
  # any ticket (second-run audit): "I've cancelled your plan", "your plan has been cancelled", "I've refunded
  # $420.00 and cancelled your plan", "your workspace has been closed", "I've processed your cancellation", "your
  # cancellation has been processed", "I've set your plan to end" (review of the second-run changes: also "your plan is
  # cancelled", "will be cancelled", "I've cancelled it"). "If you'd like to cancel, let us know", "you can turn off
  # auto-renewal and cancel your plan" and "I'm sorry the project was cancelled" pass.
  cancel_claims: &cancel_claims
    - 're:\b(we|i)(''ve| have|''ll| will)( now| also| just| already| gone ahead and)? (?:(?:cancel(?:l?ed)?|terminat(?:e|ed))\b(?:(?!\b(?:request|ticket|window|query|case|refund|email|message)\b)(?:[^.;!?]|\.\d)){0,30}\b(?:plan|subscription|account|workspace|contract)\b|clos(?:e|ed)\b(?:(?!\b(?:request|ticket|window|query|case|refund|email|message)\b)(?:[^.;!?]|\.\d)){0,30}\b(?:account|workspace)\b)'
    - 're:\b(your|the) (annual )?(business |starter |team )?(plan|subscription|account|workspace|contract) (has been|have been|is now|was|is being) (cancel(l?ed)?|terminated)\b'
    - 're:\b(?:we|i)(?:''ve| have)(?: now| also| just| already)? (?:processed|confirmed|completed|arranged|scheduled) (?:the |your |a )?cancell?ation\b'
    - 're:\b(?:your|the) cancell?ation (?:has been|was|is now|is being) (?:processed|confirmed|completed|arranged|scheduled)\b'
    - 're:\b(?:your|the) (?:account|workspace) (?:has been|have been|is now|was|is being) closed\b'
    - 're:\b(?:we|i)(?:''ve| have)(?: now| also| just| already)? set (?:your |the )?(?:plan|subscription|account|workspace) to (?:cancel|end|close)\b'
    - 're:\b(we|i)(''ve| have|''ll| will)\b(?:(?!\byou\b)(?:[^.;!?:]|\.\d)){0,60}?\b(and|then) (also )?(cancel(l?ed)?|terminat(e|ed)|clos(e|ed)) (your|the) (annual )?((business|starter|team) )?(plan|subscription|account|workspace|contract)\b'
    # Review of the second-run changes: is / will be cancelled, a name before the plan, "I've cancelled it", a
    # confirmed request.
    - 're:(?:^|[;!?:]\s?|\.(?!\d)\s?)(?:(?!\b(?:if|once|when|whenever|whether|unless|until|after|before|provided|providing|assuming|as soon as|in case|as long as|so long as|should)\b)(?:[^.;!?:]|\.\d))*?(?:\b(?:your|the)\b(?:\s+[a-z&''-]+){0,2}?\s+(?:plan|subscription|account|workspace|contract)\s+(?:is|''s|will be|has been|have been|is going to be|was)\s+(?:now\s+)?(?:cancel(?:l?ed)?|terminated|closed)\b|\b(?:we|i)(?:''ve| have)(?: now| also| just| already)? (?:cancel(?:l?ed)?|terminated) (?:it|this|that)\b|\b(?:your|the) cancell?ation(?: request)? (?:has been|was|is|is now|is being|will be) (?:processed|confirmed|completed|arranged|scheduled|done)\b)(?:(?!\b(?:if|once|when|whenever|whether|unless|until|after|before|provided|providing|assuming|as soon as|in case|as long as|so long as|should)\b)(?:[^.;!?:]|\.\d))*(?=[.;!?:](?!\d)|$)'
  window_closed: &window_closed
    - 're:\b(window|(?<!trial )period)\b[^.;!?]{0,40}?\b(closed|ended|expired|lapsed|ran out)\s+(after\s+(?!3[01]\b)\d+\s+days?\b|(?!3[01]\b)\d+\s+days?\s+(later|in|into|after)\b|on\s+day\s+(?!3[01]\b)\d+\b)'

scenarios:

# ---------------------------------------------------------------------------------------------- monthly

- id: m01
  title: Eligible monthly charge, refund issued
  category: monthly
  covers: [eligible_monthly]
  today: "2026-11-04"
  from: ana@blueheron.example
  subject: Refund for November
  body: |
    Hi,

    We've moved the studio to another tool and won't be using Fernway this month. Could you please refund invoice FW-10013 from 1 November?

    Thanks,
    Ana
  expect: {decision: refund_issued, charge_id: ch_1013, amount: 190.00, queue: null, basis: charge}
  reply_must_include: [*payout, ["$190", "190.00", "190 usd", 're:\busd ?190\b|\b190(\.00)? ?dollars']]
  reply_must_not: [*issued_no_pending, *cancel_claims]
  tools_must_not: [send_for_approval]
  example_reply: |
    Hi Ana,

    I've refunded invoice FW-10013 ($190.00, charged on 1 November). The money goes back to your original payment method within 5 to 10 business days.

    Fernway Support
  alt_replies:
    - "Hi Ana,\n\nDone: I've refunded USD 190 for invoice FW-10013. You'll see it on your original payment method within 5 to 10 business days.\n\nFernway Support"
  wrong_replies:
    - "Hi Ana,\n\nYour refund of $190.00 for invoice FW-10013 is waiting for a final approval and then goes back to your original payment method within 5 to 10 business days.\n\nFernway Support"
    # Second-run audit: a cancellation no tool made.
    - "Hi Ana,\n\nI've refunded invoice FW-10013 ($190.00). It goes back to your original payment method within 5 to 10 business days, and your cancellation has been processed.\n\nFernway Support"

