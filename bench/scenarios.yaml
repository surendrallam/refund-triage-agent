    - 're:(?:^|[;!?:]\s?|\.(?!\d)\s?)(?:(?!\b(?:if|once|when|whenever|whether|unless|until|after|before)\b)(?:[^.;!?:]|\.\d))*?\b(?:the|your|these|those|all)\s+(?:\d+\s+|two\s+|three\s+)?(?:extra\s+|added\s+|additional\s+)?seats?\s+(?:have been|has been|were|was|are now|is now|are being)\s+(?:removed|taken off|dropped|cancell?ed|deleted|scheduled for removal)\b'
    - 're:(?:^|[;!?:]\s?|\.(?!\d)\s?)(?!(?:[^.;!?:]|\.\d)*\b(?:if|once|when|whenever|whether|unless|until|after|before|you remove|you choose|you decide|you''d like|you want)\b)(?:[^.;!?:]|\.\d)*?\b(?:the|your|these|those|all)\s+(?:\d+\s+|two\s+|three\s+)?(?:extra\s+|added\s+|additional\s+)?seats?\s+(?:will|are going to|are set to|are scheduled to)\s+be\s+(?:removed|taken off|dropped|cancell?ed|deleted)\b'
