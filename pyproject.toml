[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "refund-triage-agent"
version = "0.1.0"
description = "A refund triage agent prototype: Claude reads the email, looks things up and writes the reply; code decides eligibility, amounts, identity and limits."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "anthropic>=2.5,<3",
  "pyyaml>=6",
  "python-dotenv>=1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rta = "rta.cli:main"

[tool.setuptools.packages.find]
include = ["rta*", "bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
